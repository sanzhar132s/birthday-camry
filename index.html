<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0e">
  <meta name="description" content="Именная открытка на день рождения с белой Toyota Camry.">
  <title>С днём рождения</title>
  <style>
    :root {
      color-scheme: dark;
      background: #090b0e;
      color: #fff6e5;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      display: grid;
      place-items: center;
      min-height: 100svh;
      overflow: hidden;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 50% 55%, #1c2530 0, #111820 35%, transparent 69%),
        #090b0e;
    }
    .card { position: relative; width: min(1050px, 100%); text-align: center; }
    h1 {
      margin: 0;
      min-height: 1.35em;
      font: 400 clamp(2.2rem, 7vw, 5.6rem)/1 Georgia, serif;
      letter-spacing: -.055em;
      text-wrap: balance;
      display: grid;
      place-items: center;
    }
    h1.reveal { animation: greeting 1050ms cubic-bezier(.2,.75,.25,1) both; }
    @keyframes greeting {
      from { opacity: .2; transform: translateY(12px); filter: blur(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stage { position: relative; height: clamp(250px, 48vw, 540px); isolation: isolate; }
    .floor {
      position: absolute;
      inset: 49% -50vw -14%;
      transform: rotate(-7deg) skewX(15deg);
      border-top: 1px solid #9cacc03b;
      background:
        var(--asphalt-grain, none),
        radial-gradient(ellipse at 48% 4%, #57677b61, transparent 36%),
        linear-gradient(#171e26, #29333e 53%, #10161d 93%, #0a0e13);
      mask-image: linear-gradient(90deg, transparent, #000 13% 89%, transparent),
                  linear-gradient(#000 0 71%, transparent);
      mask-composite: intersect;
    }
    .floor::before, .floor::after {
      content: "";
      position: absolute;
      inset: 12% 0 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent 15%, #adb8be4f 44% 64%, transparent 88%);
    }
    .floor::after {
      inset: 70% -4% auto 4%;
      height: clamp(1px, .32vw, 4px);
      background: repeating-linear-gradient(90deg,#eee1c8a0 0 5.2%, #b2a38781 5.2% 5.4%, transparent 5.4% 9%);
      mask-image: linear-gradient(90deg,transparent 17%,#000 39% 70%,transparent 88%);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 24% -46vw 41%;
      z-index: -1;
      background:
        radial-gradient(ellipse at 69% 73%, #c4ddf526 0, transparent 25%),
        radial-gradient(ellipse at 30% 81%, #e4be8721 0, transparent 21%);
      filter: blur(16px);
    }
    .car {
      position: absolute;
      inset: auto 3% 12%;
      aspect-ratio: 2;
      opacity: 0;
      transform: translate3d(90vw,0,0);
    }
    .car { transform-origin: 53% 77%; }
    .car img { display: block; width: 100%; pointer-events: none; }
    .shadow {
      position: absolute;
      left: 3%; top: 70%; width: 92%; height: 24%;
      transform: skewX(-20deg) rotate(-5deg);
      background: radial-gradient(ellipse at center, #000 0, #04070bd9 45%, transparent 72%);
      filter: blur(9px);
    }
    .reflection {
      position: absolute;
      inset: 0;
      transform: translateY(56%) scaleY(-.36) skewX(9deg);
      opacity: var(--reflection-opacity, .14);
      filter: blur(2px);
      mask-image: linear-gradient(transparent 24%, #000 94%);
    }
    .vehicle { position: relative; filter: brightness(.87) contrast(1.06) drop-shadow(0 16px 22px #0008); }
    .body { height: auto; }
    .lights { position: absolute; inset: 0; opacity: 0; transition: opacity 145ms ease; }
    .started .lights { opacity: .23; }
    .started .flash .lights { opacity: 1; transition-duration: 80ms; }
    .flare { position: absolute; transform: translate(-50%,-50%); border-radius: 50%; }
    .near {
      left: 38.7%; top: 55.5%; width: 22%; height: 18%;
      background: radial-gradient(ellipse, #ffffffd9 0%, #ebf5ff9c 9%, #c5e4ff34 25%, transparent 68%);
    }
    .far {
      left: 7%; top: 51%; width: 14%; height: 16%;
      background: radial-gradient(ellipse, #ffffffad 0%, #d7eaff75 13%, #afceec28 29%, transparent 68%);
    }
    .beam {
      position: absolute; left: -34%; top: 50%; width: 73%; height: 31%;
      transform: rotate(-11deg);
      background: radial-gradient(ellipse at 65% 35%, #c6deff49, #90c5ff13 47%, transparent 72%);
      filter: blur(13px);
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .actions { position: relative; z-index: 2; min-height: 52px; display: grid; place-items: center; }
    .card:not(.started) .actions { position: absolute; inset: 36% 0 auto; }
    button {
      min-height: 48px; padding: 0 25px; border: 1px solid #ffe6b1; border-radius: 999px;
      color: #2c2216; background: #f3dab0;
      font: 600 1rem/1.25 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 32px #e5ac6033;
      transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }
    @media (hover: hover) {
      button:hover { background: #ffeac5; transform: translateY(-2px); box-shadow: 0 8px 40px #e5ac6055; }
    }
    button:active { transform: scale(.97); }
    button:focus-visible { outline: 2px solid #fff1d9; outline-offset: 5px; }
    .card.playing button { visibility: hidden; }
    .card.finished button { background: #14191d; color: #f4ddba; border-color: #786853; box-shadow: none; }
    @media (max-width: 540px) {
      h1 { min-height: 2.1em; font-size: clamp(1.9rem, 7.9vw, 2.6rem); }
      .car { inset: auto 0 16%; }
      .floor { inset: 55% -55vw -6%; }
    }
    @media (prefers-reduced-motion: reduce) {
      h1.reveal { animation: none; }
      button, .lights { transition: none; }
    }
  </style>
</head>

  <script id="card-data" type="application/json">"Ерхан"</script>
  <script>
    const name = JSON.parse(document.querySelector('#card-data').textContent);
    const card = document.querySelector('.card');
    const stage = document.querySelector('.stage');
    const title = document.querySelector('h1');
    const car = document.querySelector('.car');
    const photo = car.querySelector('.body');
    car.querySelector('.reflection').src = photo.src;
    const wheelArt = document.querySelector('.wheel-art');
    const wheelBrush = wheelArt.getContext('2d');
    const button = document.querySelector('button');
    const canvas = document.querySelector('.sparks');
    const context = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const introduction = name + ', для тебя';
    const greeting = 'С днём рождения, ' + name;
    const driveTime = 4.35;
    const duration = 10.2;
    const sparkStart = 6.05;
    const wheelSpecs = [
      {x: 901, y: 651, rx: 79, ry: 124, tilt: .13},
      {x: 1574, y: 539, rx: 60, ry: 101, tilt: .10}
    ];
    let wheelTextures = [];
    let wheelPhase = 0;
    let lastWheelMotion = 0;
    const colors = ['#ffe0a2', '#ede6d8', '#d6a866'];
    const particles = Array.from({length: 44}, (_, index) => ({
      x: .28 + (index % 3) * .22,
      y: .60 + .055 * Math.sin(index),
      dx: ((index * 19 % 43) / 42 - .5) * .48,
      lift: .19 + (index * 17 % 39) / 95,
      delay: index % 11 * .034,
      size: 1 + index * 5 % 7 * .23,
      angle: index * 2.4,
      color: colors[index % colors.length]
    }));
    title.textContent = introduction;

    function textureForWheel({x, y, rx, ry, tilt}) {
      const tile = document.createElement('canvas');
      const size = 256;
      tile.width = tile.height = size;
      const brush = tile.getContext('2d');
      brush.translate(size / 2, size / 2);
      brush.scale(size / (2 * rx), size / (2 * ry));
      brush.rotate(-tilt);
      brush.drawImage(photo, -x, -y);
      brush.resetTransform();
      const mask = brush.createRadialGradient(size/2,size/2,size*.405,size/2,size/2,size/2);
      mask.addColorStop(0, '#fff');
      mask.addColorStop(1, '#fff0');
      brush.globalCompositeOperation = 'destination-in';
      brush.fillStyle = mask;
      brush.fillRect(0, 0, size, size);
      return tile;
    }

    function drawWheels() {
      wheelBrush.clearRect(0, 0, photo.naturalWidth, photo.naturalHeight);
      wheelTextures.forEach((tile, index) => {
        const {x, y, rx, ry, tilt} = wheelSpecs[index];
        wheelBrush.save();
        wheelBrush.translate(x, y);
        wheelBrush.rotate(tilt);
        wheelBrush.scale(rx, ry);
        wheelBrush.rotate(wheelPhase);
        wheelBrush.drawImage(tile, -1, -1, 2, 2);
        if (lastWheelMotion > .012) {
          wheelBrush.globalAlpha = .32;
          wheelBrush.rotate(lastWheelMotion);
          wheelBrush.drawImage(tile, -1, -1, 2, 2);
          wheelBrush.globalAlpha = .16;
          wheelBrush.rotate(lastWheelMotion);
          wheelBrush.drawImage(tile, -1, -1, 2, 2);
        }
        wheelBrush.restore();
      });
    }

    function drive(seconds) {
      const t = Math.min(seconds / driveTime, 1);
      const brakeAt = .62;
      const coast = 1 - brakeAt;
      const normalizedDistance = brakeAt + coast / 2;
      const braking = Math.max(0, (t - brakeAt) / coast);
      // Integrate the speed so the tyre turns with the travelled distance.
      const progress = (t - .5 * coast * braking * braking) / normalizedDistance;
      const travel = (window.innerWidth + car.clientWidth) * .51;
      const remaining = Math.max(0, 1 - progress);
      const x = travel * remaining;
      const radius = car.clientWidth * .075;
      const pitch = -.38 * Math.sin(Math.PI * braking);
      car.style.transform = t === 1
        ? 'translate3d(0,0,0)'
        : 'translate3d(' + x + 'px,' + (-x * .123) + 'px,0) scale(' +
          (1 - remaining * .095) + ') rotate(' + pitch + 'deg)';
      car.style.opacity = Math.min(1, t * 8);
      car.style.setProperty('--reflection-opacity', .08 + .06 * braking);
      wheelPhase = -progress * travel / radius;
      lastWheelMotion = (1 - braking) * travel / (radius * driveTime * 60 * normalizedDistance);
      drawWheels();
    }

    function asphaltGrain() {
      const tile = document.createElement('canvas');
      tile.width = tile.height = 128;
      const brush = tile.getContext('2d');
      const speckles = brush.createImageData(tile.width, tile.height);
      let seed = 874;
      for (let i = 0; i < speckles.data.length; i += 4) {
        seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
        const tone = seed >>> 24;
        speckles.data.set([tone,tone,tone,tone % 15], i);
      }
      brush.putImageData(speckles, 0, 0);
      stage.style.setProperty('--asphalt-grain', 'url(' + tile.toDataURL() + ')');
    }

    function resize() {
      const scale = Math.min(devicePixelRatio, 2);
      canvas.width = Math.round(stage.clientWidth * scale);
      canvas.height = Math.round(stage.clientHeight * scale);
      context.setTransform(scale, 0, 0, scale, 0, 0);
      wheelArt.width = Math.max(1, Math.round(car.clientWidth * scale));
      wheelArt.height = Math.max(1, Math.round(wheelArt.width / 2));
      if (photo.naturalWidth) {
        wheelBrush.setTransform(wheelArt.width / photo.naturalWidth, 0, 0,
                                wheelArt.height / photo.naturalHeight, 0, 0);
        drawWheels();
      }
    }
    new ResizeObserver(resize).observe(stage);
    resize();
    asphaltGrain();
    photo.decode().then(() => { button.disabled = false; }).catch(() => {
      button.textContent = 'Не удалось загрузить открытку';
    });

    function drawConfetti(seconds) {
      const width = stage.clientWidth, height = stage.clientHeight;
      context.clearRect(0, 0, width, height);
      for (const piece of particles) {
        const age = seconds - sparkStart - piece.delay;
        if (age < 0 || age > 3.1) continue;
        const x = (piece.x + piece.dx * age) * width;
        const y = (piece.y - piece.lift * age + .15 * age * age) * height;
        const fade = Math.min(1, age * 7, (3.1 - age) * .8);
        context.save();
        context.translate(x, y);
        context.rotate(piece.angle + age * 2);
        context.globalAlpha = fade;
        context.fillStyle = piece.color;
        context.shadowColor = piece.color;
        context.shadowBlur = 5;
        context.fillRect(-piece.size, -.6, piece.size * 2, 1.2);
        context.restore();
      }
    }

    button.addEventListener('click', () => {
      if (card.classList.contains('playing')) return;
      title.textContent = introduction;
      title.classList.remove('reveal');
      card.classList.remove('started', 'finished');
      car.setAttribute('aria-hidden', 'true');
      wheelTextures = wheelSpecs.map(textureForWheel);
      resize();
      drive(0);
      card.classList.add('started', 'playing');
      const started = performance.now();
      let parked = false;

      function tick(now) {
        const seconds = reduce.matches ? duration : Math.min((now - started) / 1000, duration);
        if (!parked) {
          drive(seconds);
          parked = seconds >= driveTime;
        }
        const flash = (seconds >= 4.67 && seconds < 5.00) || (seconds >= 5.39 && seconds < 5.73);
        stage.classList.toggle('flash', flash);
        drawConfetti(seconds);
        if (seconds >= sparkStart && title.textContent !== greeting) {
          title.textContent = greeting;
          title.classList.add('reveal');
          car.removeAttribute('aria-hidden');
        }
        if (seconds < duration) {
          requestAnimationFrame(tick);
        } else {
          card.classList.remove('playing');
          card.classList.add('finished');
          button.textContent = 'Посмотреть ещё раз';
        }
      }
      requestAnimationFrame(tick);
    });
  </script>
</body>
